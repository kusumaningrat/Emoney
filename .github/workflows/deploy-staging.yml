name: Deploy STAGING

on:
  push:
    branches:
      - staging
    paths:
      - "eMoney-identity/**"

env:
  IMAGE_TAG: staging-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-identity

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./eMoney-identity
          file: ./eMoney-identity/Dockerfile.stage
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Set image tag output
        id: set-tag
        run: echo "image-tag=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  deploy-staging:
    needs: build
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment: staging
      image-tag: ${{ needs.build.outputs.image-tag }}
      nomad-addr: ${{ vars.NOMAD_ADDR_STAGING }}
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN_STAGING }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
