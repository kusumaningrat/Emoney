name: Docker Image CI - emoney-master

on:
  push:
    branches: ["main"]
    paths:
      - "eMoney-master-service/**"

  pull_request:
    branches: ["main"]
    paths:
      - "eMoney-master-service/**"

env:
  PRODUCT_VERSION: "latest"
  VERSION: "1.2.0"
  ENVIRONMENT: "s9p"
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: self-hosted

    outputs:
      IMAGE_TAG: ${{ steps.export_tag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate IMAGE_TAG
        id: export_tag
        run: |
          IMAGE_TAG="${ENVIRONMENT}-v${VERSION}-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-master-service
          file: ./eMoney-master-service/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: self-hosted
    needs: build

    env:
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@main
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Update Nomad job image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" nomad/emoney-master.hcl

      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          nomad job run nomad/emoney-master.hcl

  notify:
  runs-on: self-hosted
  needs: [security-precheck, build, security-scan, sonar, deploy]
  if: always()

  steps:
    - name: Send Telegram Notification
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}

        IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}

        GITLEAKS_STATUS: ${{ needs.security-precheck.result }}
        TRIVY_STATUS: ${{ needs.security-scan.result }}
        SONAR_STATUS: ${{ needs.sonar.result }}
        DEPLOY_STATUS: ${{ needs.deploy.result }}

      run: |
        PIPELINE_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        BRANCH="${{ github.ref_name }}"
        ACTOR="${{ github.actor }}"

        EMOJI="✅"
        STATUS="SUCCESS"
        DETAILS=""

        # Detect failures
        if [ "$GITLEAKS_STATUS" != "success" ]; then
          EMOJI="❌"
          STATUS="FAILED"
          DETAILS="${DETAILS}🔐 Gitleaks: Secrets detected\n"
        fi

        if [ "$SONAR_STATUS" != "success" ]; then
          EMOJI="❌"
          STATUS="FAILED"
          DETAILS="${DETAILS}📊 SonarQube: Quality Gate failed\n"
        fi

        if [ "$TRIVY_STATUS" != "success" ]; then
          EMOJI="❌"
          STATUS="FAILED"
          DETAILS="${DETAILS}🛡 Trivy: High/Critical vulnerabilities found\n"
        fi

        if [ "$DEPLOY_STATUS" != "success" ]; then
          EMOJI="❌"
          STATUS="FAILED"
          DETAILS="${DETAILS}🚀 Deploy: Deployment failed\n"
        fi

        if [ -z "$DETAILS" ]; then
          DETAILS="No issues detected."
        fi

        MESSAGE=$(printf "🚀 EMoney CI/CD Pipeline\n\n📦 Image: %s\n🌿 Branch: %s\n👤 Triggered by: %s\n\n📊 Overall Status: %s %s\n\n📝 Details:\n%s\n🔗 %s" \
          "$IMAGE_TAG" \
          "$BRANCH" \
          "$ACTOR" \
          "$EMOJI" \
          "$STATUS" \
          "$DETAILS" \
          "$PIPELINE_URL")

        if [ -z "$TELEGRAM_THREAD_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
        else
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "message_thread_id=${TELEGRAM_THREAD_ID}" \
            --data-urlencode "text=${MESSAGE}"
        fi
