# Deployment pipeline workflow generated by the platform and committed to
# .github/workflows/deploy.yml.
#
# It orchestrates the repository's reusable workflows. A push to the deploy
# branch builds and deploys to dev automatically; staging and prod are manual
# (workflow_dispatch) and gated by a pipeline key. The reusable deploy workflow
# substitutes ${IMAGE_TAG} into the referenced Nomad job file with sed.
#
# The platform renders the values below from the selected repository service
# and the deployment input. Placeholders:
#   Emoney Identity Test  human-readable workflow name (from the service name)
#   main         branch that triggers the automatic dev deployment
#   eMoney-identity-new    directory holding the service sources / Dockerfile
#   emoney-identity-test   logical service name
#   image-reg.ops.glynac.ai     image repository base passed to the build
#   nomad/emoney-identity-test-dev.hcl   Nomad job file for dev
#   nomad/emoney-identity-test-staging.hcl Nomad job file for staging
#   nomad/emoney-identity-test-prod.hcl  Nomad job file for prod
name: Emoney Identity Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      secret_key:
        description: "Enter pipeline key to proceed"
        required: true
        type: string
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - prod
      sha:
        description: "SHA to promote (prod only)"
        required: false
        type: string
      major_bump:
        description: "Force a major version bump instead of auto minor/patch (staging only — tagging happens on staging deploy)"
        required: false
        type: boolean
        default: false

env:
  TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

jobs:
  # ─────────────────────────────────────────
  # KEY VALIDATION (manual trigger only)
  # ─────────────────────────────────────────
  validate-key:
    name: Validate Pipeline Key
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check pipeline key
        env:
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          INPUT_KEY: ${{ github.event.inputs.secret_key }}
        run: |
          if [ "$INPUT_KEY" != "$PIPELINE_KEY" ]; then
            echo "❌ Invalid pipeline key. Access denied."
            exit 1
          fi
          echo "✅ Key validated. Proceeding..."

  # ─────────────────────────────────────────
  # BUILD (auto on push, or manual staging)
  # ─────────────────────────────────────────
  build:
    needs: [validate-key]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.environment == 'staging' &&
          needs.validate-key.result == 'success'
        )
      )
    uses: ./.github/workflows/_reusable-build.yml
    with:
      service-dir: eMoney-identity-new
      service-name: emoney-identity-test
      image-base: image-reg.ops.glynac.ai
      environment: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}

  # ─────────────────────────────────────────
  # DEPLOY DEV — auto on every push to the deploy branch
  # ─────────────────────────────────────────
  deploy-dev:
    needs: build
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
      nomad-addr: ${{ vars.NOMAD_ADDR }}
      nomad-job-file: nomad/emoney-identity-test-dev.hcl
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  # ─────────────────────────────────────────
  # DEPLOY STAGING — manual only
  # ─────────────────────────────────────────
  deploy-staging:
    needs: [validate-key, build]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'staging' &&
      needs.validate-key.result == 'success' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment: staging
      image-tag: ${{ needs.build.outputs.image-tag }}
      nomad-addr: ${{ vars.NOMAD_ADDR_STAGING }}
      nomad-job-file: nomad/emoney-identity-test-staging.hcl
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

  # ─────────────────────────────────────────
  # DEPLOY PROD — manual only, promotes a staging SHA
  # ─────────────────────────────────────────
  deploy-prod:
    needs: [validate-key]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod' &&
      needs.validate-key.result == 'success'
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment: prod
      image-tag: staging-${{ inputs.sha }}
      nomad-addr: ${{ vars.NOMAD_ADDR }}
      nomad-job-file: nomad/emoney-identity-test-prod.hcl
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
