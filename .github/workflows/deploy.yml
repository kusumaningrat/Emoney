# Generic build-and-deploy workflow injected into a repository as
# .github/workflows/deploy.yml.
#
# This is a starting template a platform engineer should adjust to the
# organization's image registry, build tools and Nomad connection. It builds
# from the repository root ("read root directory"), publishes the image and
# submits the rendered nomad/nomad.hcl.
#
# Required repository secrets:
#   REGISTRY_USERNAME / REGISTRY_PASSWORD  registry credentials
#   NOMAD_ADDR / NOMAD_TOKEN               Nomad server + deploy ACL token
#
# Placeholders:
#   main   branch this workflow runs on (must match the deploy branch)
#   image-reg.ops.glynac.ai    image reference, must match the value rendered in nomad.hcl
#   default Nomad namespace, must match the value rendered in nomad.hcl
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: image-reg.ops.glynac.ai

      - name: Set up Nomad
        uses: hashicorp/setup-nomad@main

      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad job run -namespace=default nomad/nomad.hcl