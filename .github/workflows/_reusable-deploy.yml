name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      nomad-addr: # ← add this
        required: true
        type: string
      nomad-job-file:
        required: false
        type: string
        default: "nomad/emoney-identity.hcl"
    secrets:
      HARBOR_TOKEN:
        required: true
      NOMAD_TOKEN:
        required: true
      TEAMS_WEBHOOK_URL:
        required: false
    outputs:
      image-tag:
        description: "The image tag that was deployed"
        value: ${{ jobs.deploy.outputs.image-tag }}

env:
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-identity

jobs:
  deploy:
    runs-on: self-hosted
    outputs:
      image-tag: ${{ inputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Retag image for ${{ inputs.environment }}
        run: |
          IMAGE=image-reg.ops.glynac.ai/emoney-advisor/emoney-identity
          TAG=${{ inputs.image-tag }}
          ENV=${{ inputs.environment }}

          echo "Pulling $IMAGE:$TAG"
          docker pull $IMAGE:$TAG

          echo "Tagging as $IMAGE:$ENV"
          docker tag $IMAGE:$TAG $IMAGE:$ENV
          docker push $IMAGE:$ENV

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@main

      - name: Update Nomad job with image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ inputs.image-tag }}|g" ${{ inputs.nomad-job-file }}

      - name: Deploy to Nomad (${{ inputs.environment }})
        env:
          NOMAD_ADDR: ${{ inputs.nomad-addr }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad job run ${{ inputs.nomad-job-file }}

  notify:
    runs-on: self-hosted
    needs: deploy
    if: always()
    steps:
      - name: Send MS Teams Notification
        shell: bash
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL not set; skipping."
            exit 0
          fi

          PIPELINE_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            STATUS="✅ SUCCESS"
            DETAILS="Deployed to ${ENVIRONMENT} successfully."
          else
            STATUS="❌ FAILED"
            DETAILS="Deployment to ${ENVIRONMENT} failed."
          fi

          MESSAGE=$(printf "🚀 EMoney Deploy — %s\n\n🌿 Branch: %s\n🏷 Image: %s\n👤 By: %s\n\n📊 %s\n📝 %s\n\n🔗 %s" \
            "$ENVIRONMENT" "$BRANCH" "$IMAGE_TAG" "$ACTOR" "$STATUS" "$DETAILS" "$PIPELINE_URL")

          export MESSAGE
          TEAMS_PAYLOAD="$(python3 -c 'import json,os; m=os.environ["MESSAGE"]; print(json.dumps({"text": m}))')"

          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$TEAMS_PAYLOAD" "$TEAMS_WEBHOOK_URL"
