name: Reusable Build

on:
  workflow_call:
    inputs:
      service-dir:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: "Dockerfile.stage"
      image-base:
        required: true
        type: string
      service-name:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      HARBOR_TOKEN:
        required: true
    outputs:
      image-tag:
        description: "The image tag that was built"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service-dir }}
          file: ./${{ inputs.service-dir }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image-base }}/${{ inputs.service-name }}:${{ inputs.environment }}-${{ github.sha }}

      - name: Set image tag output
        id: set-tag
        run: echo "image-tag=${{ inputs.environment }}-${{ github.sha }}" >> $GITHUB_OUTPUT
