name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "eMoney-identity/**"
  pull_request:
    branches: ["main"]
    paths:
      - "eMoney-identity/**"

env:
  PRODUCT_VERSION: "latest" # or: "latest"
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-identity

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-identity
          file: ./eMoney-identity/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          builder: default

      - name: Save image tag
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

  security-scan:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan (fast)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/root" \
            aquasec/trivy:latest image \
            --security-checks vuln \
            --format json \
            --output /root/emoney-identity-report.json \
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Upload Trivy report to DefectDojo
        run: |
          curl -s -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@/root/emoney-identity-report.json" \
            -F "product_name=EMoney_Identity_Scan" \
            -F "product_type_name=Web Application" \
            -F "engagement_name=CI Pipeline" \
            -F "auto_create_context=true"

  deploy:
    runs-on: self-hosted
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup `nomad`
        uses: hashicorp/setup-nomad@main
        id: setup
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Update Nomad deployment with image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" nomad/emoney-identity.hcl

      - name: Request deployment to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad job run nomad/emoney-identity.hcl
