name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "eMoney-identity/**"

env:
  PRODUCT_NAME: EMoney_Identity_Scan
  PRODUCT_TYPE: Web Application
  ENGAGEMENT_NAME: CI Pipeline
  PRODUCT_VERSION: "latest"
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-identity

permissions:
  contents: read
  id-token: write

jobs:
  security-precheck:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan (optimized)
        id: gitleaks
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.18.2 detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Upload Gitleaks report to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/"" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@gitleaks-report.json" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "product_type_name=${{ env.PRODUCT_TYPE }}" \
            -F "engagement_name=${{ env.ENGAGEMENT_NAME }}" \
            -F "auto_create_context=true"

      - name: Stop pipeline if leaks found
        if: steps.gitleaks.outputs.exit_code != '0'
        run: |
          echo "❌ Secrets detected — stopping pipeline"
          exit 1

  build:
    runs-on: self-hosted
    needs: security-precheck

    steps:
      - uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-identity
          file: ./eMoney-identity/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

  security-scan:
    runs-on: self-hosted
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Create Trivy cache directory
        run: sudo mkdir -p /opt/trivy-cache

      - name: Trivy scan (optimized)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt/trivy-cache:/root/.cache/trivy \
            -v "$PWD:/tmp" \
            aquasec/trivy:0.50.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /tmp/emoney-identity-report.json \
            --exit-code 1 \
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Upload Trivy report to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@emoney-identity-report.json" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "product_type_name=${{ env.PRODUCT_TYPE }}" \
            -F "engagement_name=${{ env.ENGAGEMENT_NAME }}" \
            -F "auto_create_context=true"

  deploy:
    runs-on: self-hosted
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - name: Setup `nomad`
        uses: hashicorp/setup-nomad@main
        id: setup
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Update Nomad deployment with image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" nomad/emoney-identity.hcl

      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad job run nomad/emoney-identity.hcl
