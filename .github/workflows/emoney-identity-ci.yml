name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "eMoney-identity/**"
  pull_request:
    branches: ["main"]
    paths:
      - "eMoney-identity/**"

env:
  PRODUCT_NAME: EMoney_Identity_Scan
  PRODUCT_TYPE: Web Application
  ENGAGEMENT_NAME: CI Pipeline

  PRODUCT_VERSION: "latest"
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-identity

permissions:
  contents: read
  id-token: write

jobs:
  security-precheck:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        id: gitleaks
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.18.2 detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Upload Gitleaks report to DefectDojo
        if: always()
        run: |
          curl -s -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@gitleaks-report.json" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "product_type_name=${{ env.PRODUCT_TYPE }}" \
            -F "engagement_name=${{ env.ENGAGEMENT_NAME }}" \
            -F "auto_create_context=true"

      # - name: Stop pipeline if leaks found
      #   if: steps.gitleaks.outputs.exit_code != '0'
      #   run: |
      #     echo "❌ Secrets detected — stopping pipeline"
      #     exit 1

  sonar:
    runs-on: self-hosted
    needs: security-precheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: eMoney-identity
          args: >
            -Dsonar.projectKey=emoney-identity
            -Dsonar.projectName=emoney-identity
            -Dsonar.sources=.
            -Dsonar.python.version=3.11
            -Dsonar.javascript.file.suffixes=-
            -Dsonar.typescript.file.suffixes=-
            -Dsonar.exclusions=**/__pycache__/**,**/venv/**,**/migrations/**,**/*.js,**/*.ts,**/*.jsx,**/*.tsx
            -Dsonar.plugins.downloadOnlyRequired=true
            -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: eMoney-identity/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    runs-on: self-hosted
    needs: sonar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-identity
          file: ./eMoney-identity/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Save image tag
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

  security-scan:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Trivy cache directory
        run: mkdir -p /opt/trivy-cache

      - name: Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /opt/trivy-cache:/root/.cache/trivy \
            -v "$PWD:/tmp" \
            aquasec/trivy:0.50.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /tmp/emoney-identity-report.json \
            --exit-code 1 \
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Upload Trivy report to DefectDojo
        run: |
          curl -s -X POST "${{ vars.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@emoney-identity-report.json" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "product_type_name=${{ env.PRODUCT_TYPE }}" \
            -F "engagement_name=${{ env.ENGAGEMENT_NAME }}" \
            -F "auto_create_context=true"

  deploy:
    runs-on: self-hosted
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@main
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Update Nomad deployment with image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" nomad/emoney-identity.hcl

      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad job run nomad/emoney-identity.hcl

  notify:
    runs-on: self-hosted
    needs: [security-precheck, build, security-scan, sonar, deploy]
    if: always()

    steps:
      - name: Send MS Notification
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

          GITLEAKS_STATUS: ${{ needs.security-precheck.result }}
          TRIVY_STATUS: ${{ needs.security-scan.result }}
          SONAR_STATUS: ${{ needs.sonar.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}

        run: |
          set -euo pipefail

          if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
            echo "TEAMS_WEBHOOK_URL is not set; skipping Teams notification."
            echo "Note: GitHub Actions secrets are not available to workflows triggered from forked pull requests."
            exit 0
          fi

          PIPELINE_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"

          DETAILS=""
          FAILED_STAGE=""

          # Only mark actual failures (not skipped)
          if [ "$GITLEAKS_STATUS" = "failure" ]; then
            FAILED_STAGE="Security Precheck"
            DETAILS="🔐 Gitleaks: Secrets detected"
          fi

          if [ "$SONAR_STATUS" = "failure" ]; then
            FAILED_STAGE="Code Quality"
            DETAILS="📊 SonarQube: Quality Gate failed"
          fi

          if [ "$TRIVY_STATUS" = "failure" ]; then
            FAILED_STAGE="Container Security"
            DETAILS="🛡 Trivy: High/Critical vulnerabilities found"
          fi

          if [ "$DEPLOY_STATUS" = "failure" ]; then
            FAILED_STAGE="Deployment"
            DETAILS="🚀 Deployment failed"
          fi

          # If nothing failed
          if [ -z "$FAILED_STAGE" ]; then
            STATUS="✅ SUCCESS"
            DETAILS="No issues detected."
          else
            STATUS="❌ FAILED at ${FAILED_STAGE}"
          fi

          MESSAGE=$(printf "🚀 EMoney CI/CD Pipeline\n\n🌿 Branch: %s\n👤 Triggered by: %s\n\n📊 Status: %s\n\n📝 %s\n\n🔗 %s" \
            "$BRANCH" \
            "$ACTOR" \
            "$STATUS" \
            "$DETAILS" \
            "$PIPELINE_URL")

          export MESSAGE
          if command -v jq >/dev/null 2>&1; then
            TEAMS_PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text, message: $text}')
          elif command -v python3 >/dev/null 2>&1; then
            TEAMS_PAYLOAD="$(python3 -c 'import json,os; m=os.environ["MESSAGE"]; print(json.dumps({"text": m, "message": m}))')"
          else
            esc="${MESSAGE//\\/\\\\}"
            esc="${esc//\"/\\\"}"
            esc="${esc//$'\n'/\\n}"
            TEAMS_PAYLOAD="{\"text\":\"$esc\",\"message\":\"$esc\"}"
          fi

          http_code="$(curl -sS -o teams_webhook_response.txt -D teams_webhook_headers.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$TEAMS_PAYLOAD" \
            "$TEAMS_WEBHOOK_URL")"

          echo "Teams webhook HTTP status: ${http_code}"
          if [ -s teams_webhook_headers.txt ]; then
            echo "Teams webhook response headers (filtered):"
            grep -iE '^(x-ms-workflow-run-id|x-ms-request-id|x-ms-correlation-id|location):' teams_webhook_headers.txt || true
          fi
          if [ -s teams_webhook_response.txt ]; then
            echo "Teams webhook response:"
            cat teams_webhook_response.txt
          fi

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Teams notification failed (HTTP ${http_code})."
            exit 1
          fi
