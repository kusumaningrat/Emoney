name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "eMoney-account/**"
  pull_request:
    branches: ["main"]
    paths:
      - "eMoney-account/**"

env:
  PRODUCT_VERSION: "latest" # or: "latest"
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-account

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-account
          file: ./eMoney-account/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          builder: default

      - name: Save image tag
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_nomad_addr: ${{ vars.NOMAD_ADDR }}
          TF_VAR_nomad_token: ${{ secrets.NOMAD_TOKEN }}
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
        run: terraform apply -auto-approve
