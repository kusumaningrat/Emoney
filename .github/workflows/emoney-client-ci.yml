name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - "eMoney-client/**"
  pull_request:
    branches: ["main"]
    paths:
      - "eMoney-client/**"

env:
  PRODUCT_VERSION: "latest" # or: "latest"
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-client

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-client
          file: ./eMoney-client/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          builder: default

      - name: Save image tag
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup `nomad`
        uses: hashicorp/setup-nomad@main
        id: setup
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Update Nomad deployment with image tag
        run: |
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" nomad/emoney-client.hcl

      - name: Request deployment to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad job run nomad/emoney-client.hcl

  smoke-test:
    runs-on: self-hosted
    needs: deploy
    env:
      SERVICE_URL: ${{ vars.SERVICE_URL }}
      NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait until service is ready
        run: |
          for i in {1..12}; do
            if curl -fs $SERVICE_URL/api/health; then
              echo "Service is up"
              exit 0
            fi
            echo "Waiting..."
            sleep 5
          done
          echo "Service failed to start"
          exit 1

      - name: Run smoke test
        id: smoke
        run: chmod +x eMoney-client/scripts/smoke-test.sh && bash eMoney-client/scripts/smoke-test.sh
        continue-on-error: true

      - name: Rollback if smoke test failed
        if: steps.smoke.outcome == 'failure'
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          echo "❌ Smoke test failed. Rolling back..."

          JOB_NAME="Emoney-client-App"
          NAMESPACE="extraction-service"

          # Get versions
          VERSIONS=$(nomad job history -namespace=$NAMESPACE -json $JOB_NAME | jq '.[].Version')


          echo "Versions: $VERSIONS"

          # Get current version (first) and previous (second)
          CURRENT_VERSION=$(echo "$VERSIONS" | sed -n '1p')
          PREV_VERSION=$(echo "$VERSIONS" | sed -n '2p')

          echo "Current: $CURRENT_VERSION"
          echo "Previous: $PREV_VERSION"

          if [ -z "$PREV_VERSION" ]; then
            echo "❌ No previous version to rollback to"
            exit 1
          fi

          nomad job revert -namespace=$NAMESPACE $JOB_NAME $PREV_VERSION

      - name: Fail pipeline if rollback happened
        if: steps.smoke.outcome == 'failure'
        run: exit 1
