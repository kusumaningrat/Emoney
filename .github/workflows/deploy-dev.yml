name: Deploy DEV

on:
  push:
    branches:
      - dev # triggers when feature/* is merged to dev
    paths:
      - "eMoney-identity/**"

env:
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
  DOCKER_IMAGE: image-reg.ops.glynac.ai/emoney-advisor/emoney-identity

jobs:
  build:
    runs-on: self-hosted
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: image-reg.ops.glynac.ai
          username: admin
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./eMoney-identity
          file: ./eMoney-identity/Dockerfile.stage
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:dev

  # ── Deploy to DEV using reusable workflow ──
  deploy-dev:
    needs: build
    uses: ./.github/workflows/_reusable-deploy.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
      nomad-addr: ${{ vars.NOMAD_ADDR }}
    secrets:
      HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
      NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
