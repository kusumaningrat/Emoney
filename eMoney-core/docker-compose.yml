version: '3.8'

name: emoney-service-orchestrator

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emoney-service-orchestrator
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Application settings
      - APP_NAME=${APP_NAME:-EMoney Service Orchestrator}
      - API_VERSION=${API_VERSION:-v1}
      - DEBUG=${DEBUG:-False}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      
      # Security
      - API_KEY=${API_KEY:-default_api_key}
      - SECRET_KEY=${SECRET_KEY:-default_secret_key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-emoney_orchestrator}
      
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      
      # EMoney Service settings
      - DEFAULT_SERVICE_TIMEOUT=${DEFAULT_SERVICE_TIMEOUT:-30.0}
      - SCAN_RESULT_RETENTION_DAYS=${SCAN_RESULT_RETENTION_DAYS:-30}
      - MAX_RETRY_ATTEMPTS=${MAX_RETRY_ATTEMPTS:-3}
      - RATE_LIMIT_RETRY_AFTER=${RATE_LIMIT_RETRY_AFTER:-60}
      
      # EMoney Master Connector URLs
      - EMONEY_ACCOUNT_URL_DEV=${EMONEY_ACCOUNT_URL_DEV:-http://host.docker.internal:4709}
      - EMONEY_CLIENT_URL_DEV=${EMONEY_CLIENT_URL_DEV:-http://host.docker.internal:4709}
      - EMONEY_FINANCIAL_PLANNING_URL_DEV=${EMONEY_FINANCIAL_PLANNING_URL_DEV:-http://host.docker.internal:4709}
      - EMONEY_IDENTITY_URL_DEV=${EMONEY_IDENTITY_URL_DEV:-http://host.docker.internal:4709}
      
      # EMoney Master Connector URLs - Staging
      - EMONEY_ACCOUNT_URL_STAGE=${EMONEY_ACCOUNT_URL_STAGE:-http://host.docker.internal:5709}
      - EMONEY_CLIENT_URL_STAGE=${EMONEY_CLIENT_URL_STAGE:-http://host.docker.internal:5709}
      - EMONEY_FINANCIAL_PLANNING_URL_STAGE=${EMONEY_FINANCIAL_PLANNING_URL_STAGE:-http://host.docker.internal:5709}
      - EMONEY_IDENTITY_URL_STAGE=${EMONEY_IDENTITY_URL_STAGE:-http://host.docker.internal:5709}
      
      # EMoney Master Connector URLs - Production
      - EMONEY_ACCOUNT_URL_PROD=${EMONEY_ACCOUNT_URL_PROD:-http://host.docker.internal:3709}
      - EMONEY_CLIENT_URL_PROD=${EMONEY_CLIENT_URL_PROD:-http://host.docker.internal:3709}
      - EMONEY_FINANCIAL_PLANNING_URL_PROD=${EMONEY_FINANCIAL_PLANNING_URL_PROD:-http://host.docker.internal:3709}
      - EMONEY_IDENTITY_URL_PROD=${EMONEY_IDENTITY_URL_PROD:-http://host.docker.internal:3709}
      
      # EMoney Authentication defaults
      - EMONEY_DEFAULT_API_KEY=${EMONEY_DEFAULT_API_KEY:-emoney-api-key-67890}
      - EMONEY_DEFAULT_CLIENT_ID=${EMONEY_DEFAULT_CLIENT_ID:-emoney-client-id-12345}
      - EMONEY_DEFAULT_FIRM_ID=${EMONEY_DEFAULT_FIRM_ID:-firm-12345}
      - EMONEY_DEFAULT_SCOPE=${EMONEY_DEFAULT_SCOPE:-API}
      - EMONEY_JWT_EXPIRY_HOURS=${EMONEY_JWT_EXPIRY_HOURS:-24}
      
      # EMoney Batch processing settings
      - EMONEY_DEFAULT_BATCH_SIZE=${EMONEY_DEFAULT_BATCH_SIZE:-100}
      - EMONEY_MAX_BATCH_SIZE=${EMONEY_MAX_BATCH_SIZE:-1000}
      - EMONEY_PAGINATION_LIMIT=${EMONEY_PAGINATION_LIMIT:-100}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "5730:5730"
    networks:
      - emoney-orchestrator-network
    volumes:
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5730/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:15-alpine
    container_name: emoney-orchestrator-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-emoney_orchestrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - emoney-orchestrator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: emoney-orchestrator-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@emoney-orchestrator.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    networks:
      - emoney-orchestrator-network
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro

  # EMoney Master Connector Mock Service for Development (Optional)
  emoney-master-mock:
    image: wiremock/wiremock:latest
    container_name: emoney-master-mock
    restart: unless-stopped
    ports:
      - "4709:8080"
    networks:
      - emoney-orchestrator-network
    volumes:
      - ./mock-services/emoney-master:/home/wiremock
    command: >
      --global-response-templating
      --verbose
      --port 8080
      --root-dir /home/wiremock
    profiles:
      - dev
      - mock

  # Redis for EMoney scan caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: emoney-orchestrator-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - emoney-orchestrator-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - prod
      - staging
      - cache

  # EMoney monitoring and observability
  prometheus:
    image: prom/prometheus:latest
    container_name: emoney-orchestrator-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - emoney-orchestrator-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring
      - prod

  grafana:
    image: grafana/grafana:latest
    container_name: emoney-orchestrator-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - emoney-orchestrator-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - prod

networks:
  emoney-orchestrator-network:
    driver: bridge
    name: emoney-orchestrator-network

volumes:
  postgres_data:
    name: emoney-orchestrator-postgres-data
  pgadmin_data:
    name: emoney-orchestrator-pgadmin-data
  redis_data:
    name: emoney-orchestrator-redis-data
  prometheus_data:
    name: emoney-orchestrator-prometheus-data
  grafana_data:
    name: emoney-orchestrator-grafana-data